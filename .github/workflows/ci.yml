name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r applications/backend/requirements.txt pytest httpx
      - run: pytest -q applications/backend
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install platformio
      - run: cp esp32-esp8266/include/secrets.example.h esp32-esp8266/include/secrets.h
      - run: pio run -d esp32-esp8266 -e wokwi -e wisdom
