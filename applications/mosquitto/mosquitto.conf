# Dev: anônimo. Para a entrega: allow_anonymous false + password_file + acl_file (ver docs/PROTOCOLO_MQTT.md)
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
# IPv6 (obrigatório no projeto): sem bind_address, o Mosquitto 2 já escuta em IPv4 e IPv6.
# Para forçar só um: socket_domain ipv4 | ipv6. Em Docker, usar docker-compose.ipv6.yml.
