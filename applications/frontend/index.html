<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnteceDengue – Dashboard</title>
<style>
  :root{--bg:#0f1720;--card:#18232f;--tx:#e8eef4;--mut:#8aa0b3;--ok:#3ecf8e;--bad:#ef5b5b;--warn:#f5b84b;--acc:#4aa3ff}
  *{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
  header{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #243445}
  h1{font-size:18px;margin:0}main{padding:16px 20px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  .card{background:var(--card);border-radius:10px;padding:14px}.card h2{margin:0 0 10px;font-size:14px;color:var(--mut);font-weight:600}
  .big{font-size:30px;font-weight:700}.row{display:flex;gap:18px;flex-wrap:wrap}.row div span{display:block;font-size:12px;color:var(--mut)}
  .badge{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#333}
  .online{background:var(--ok);color:#06241a}.offline{background:var(--bad);color:#2b0606}.unknown{background:#555}
  .alert{background:var(--warn);color:#2a1c00;padding:6px 10px;border-radius:6px;margin-top:8px;font-weight:600}
  canvas{width:100%;height:170px;display:block}
  button,input,select{font:inherit;padding:7px 10px;border-radius:6px;border:1px solid #2c4156;background:#101a24;color:var(--tx)}
  button{background:var(--acc);color:#04182b;border:0;cursor:pointer;font-weight:600}button.sec{background:#2c4156;color:var(--tx)}
  .ctl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
  ul{list-style:none;margin:0;padding:0;max-height:220px;overflow:auto;font-size:13px}li{padding:4px 0;border-bottom:1px solid #243445}
  .full{grid-column:1/-1}
</style>
</head>
<body>
<header><h1>🦟 AnteceDengue · Estações</h1><div><span id="ip" class="badge unknown" title="Versão de IP da conexão backend↔broker">IP…</span> <span id="ws" class="badge unknown">ws…</span></div></header>
<main>
  <section class="card"><h2>Estação</h2>
    <div class="ctl"><select id="sel"></select><span id="st" class="badge unknown">unknown</span></div>
    <div class="row">
      <div><span>Temperatura</span><b class="big" id="t">–</b></div>
      <div><span>Umidade</span><b class="big" id="h">–</b></div>
      <div><span>Chuva (intervalo)</span><b class="big" id="r">–</b></div>
      <div><span>Bateria</span><b class="big" id="b">–</b></div>
    </div>
    <div id="al"></div><div style="color:var(--mut);font-size:12px;margin-top:8px" id="up">sem dados</div>
  </section>
  <section class="card"><h2>Comandos (dashboard → ESP32)</h2>
    <div class="ctl"><button onclick="cmd({led:true})">LED ligar</button><button class="sec" onclick="cmd({led:false})">LED desligar</button></div>
    <div class="ctl"><label>Intervalo (s) <input id="iv" type="number" value="10" min="2" max="3600" style="width:80px"></label>
      <button onclick="cmd({interval_s:+iv.value})">Aplicar</button></div>
    <div class="ctl"><label>Alerta chuva (mm) <input id="ra" type="number" value="10" step="0.1" style="width:80px"></label>
      <button onclick="cmd({rain_alert_mm:+ra.value})">Aplicar</button></div>
    <div id="cmsg" style="color:var(--mut);font-size:13px"></div>
  </section>
  <section class="card full"><h2>Temperatura / Umidade (últimas leituras)</h2><canvas id="c1"></canvas></section>
  <section class="card full"><h2>Chuva por leitura (mm)</h2><canvas id="c2"></canvas></section>
  <section class="card full"><h2>Eventos</h2><ul id="ev"></ul></section>
</main>
<script>
const $=id=>document.getElementById(id);let cur=null,hist=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function j(u,o){const r=await fetch(u,o);if(!r.ok)throw new Error(await r.text());return r.json()}
async function loadStations(){
  const s=await j('/api/stations');const sel=$('sel');
  const keep=sel.value;sel.innerHTML=s.map(x=>`<option>${esc(x.station_id)}</option>`).join('');
  if(keep&&s.some(x=>x.station_id==keep))sel.value=keep;
  cur=sel.value||null;if(cur){const x=s.find(y=>y.station_id==cur);setStatus(x.status);await loadHist()}
}
$('sel').onchange=()=>{cur=$('sel').value;$('cmsg').textContent='';loadHist()};
function setStatus(s){$('st').textContent=s;$('st').className='badge '+s}
async function loadHist(){if(!cur)return;hist=await j('/api/telemetry?station='+cur+'&limit=120');render()}
function show(d){
  $('t').textContent=d.temperature_c!=null?d.temperature_c.toFixed(1)+' °C':'–';
  $('h').textContent=d.relative_humidity!=null?d.relative_humidity.toFixed(0)+' %':'–';
  $('r').textContent=(d.rainfall_mm??0).toFixed(1)+' mm';
  $('b').textContent=d.battery_voltage!=null?d.battery_voltage.toFixed(2)+' V':'–';
  const a=d.alert;$('al').innerHTML=(a&&(Array.isArray(a)?a.length:a))?`<div class="alert">⚠ Alerta: ${esc(Array.isArray(a)?a.join(', '):'limiar')}</div>`:'';
  $('up').textContent='última leitura: '+new Date((d.timestamp||d.ts)*1000).toLocaleTimeString();
}
function line(cv,series,colors){
  const c=cv.getContext('2d'),W=cv.width=cv.clientWidth*devicePixelRatio,H=cv.height=cv.clientHeight*devicePixelRatio;
  c.clearRect(0,0,W,H);const all=series.flat().filter(v=>v!=null);if(!all.length)return;
  const lo=Math.min(...all),hi=Math.max(...all),sp=(hi-lo)||1;
  series.forEach((s,k)=>{c.strokeStyle=colors[k];c.lineWidth=2*devicePixelRatio;c.beginPath();
    s.forEach((v,i)=>{if(v==null)return;const x=i/(Math.max(s.length-1,1))*W,y=H-8-(v-lo)/sp*(H-16);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()});
  c.fillStyle='#8aa0b3';c.font=`${11*devicePixelRatio}px sans-serif`;c.fillText(hi.toFixed(1),4,12*devicePixelRatio);c.fillText(lo.toFixed(1),4,H-2);
}
function render(){
  if(hist.length)show(hist[hist.length-1]);
  line($('c1'),[hist.map(h=>h.temperature_c),hist.map(h=>h.relative_humidity)],['#f5b84b','#4aa3ff']);
  line($('c2'),[hist.map(h=>h.rainfall_mm)],['#3ecf8e']);
}
async function cmd(b){
  if(!cur)return;try{await j('/api/cmd/'+cur,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});
  $('cmsg').textContent='enviado: '+JSON.stringify(b)+' (aguardando ack…)'}catch(e){$('cmsg').textContent='erro: '+e.message}
}
async function loadEvents(){const e=await j('/api/events?limit=30');
  $('ev').innerHTML=e.map(x=>`<li>${new Date(x.ts*1000).toLocaleTimeString()} · <b>${esc(x.station_id)}</b> · ${esc(x.kind)} ${esc(x.detail)}</li>`).join('')}
function connect(){
  const ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.onopen=()=>{$('ws').textContent='ao vivo';$('ws').className='badge online'};
  ws.onclose=()=>{$('ws').textContent='reconectando';$('ws').className='badge offline';setTimeout(connect,2000)};
  ws.onmessage=ev=>{const m=JSON.parse(ev.data);
    if(m.type=='telemetry'){if(![...$('sel').options].some(o=>o.value==m.station_id)){loadStations();return}
      if(m.station_id==cur){hist.push(m);hist=hist.slice(-120);render()}}
    else if(m.type=='status'){if(m.station_id==cur)setStatus(m.status);loadEvents()}
    else if(m.type=='ack'){if(m.station_id==cur)$('cmsg').textContent='ack: '+m.data;loadEvents()}};
}
async function loadHealth(){try{const h=await (await fetch('/api/health')).json();const e=$('ip');e.textContent=h.ip||(h.mqtt?'IP ?':'sem broker');e.className='badge '+(h.ip=='IPv6'?'online':(h.ip?'unknown':'offline'))}catch(_){}}
loadStations().then(loadEvents);connect();loadHealth();setInterval(loadEvents,15000);setInterval(loadHealth,10000);
</script>
</body>
</html>
