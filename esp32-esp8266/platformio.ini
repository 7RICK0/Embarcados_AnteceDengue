[platformio]
default_envs = wokwi

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0

; Simulação (Wokwi): DHT22 no lugar do HTU21D, Wi-Fi "Wokwi-GUEST", broker público
[env:wokwi]
build_flags = -DUSE_DHT22 -DWIFI_WOKWI
lib_deps =
    ${env.lib_deps}
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; Hardware real (BlackBoard Wisdom): HTU21D via I2C
[env:wisdom]
build_flags = -DUSE_HTU21D
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit HTU21DF Library@^1.0.5
